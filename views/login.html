<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>כניסת ניהול</title>
<style>
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#f7f1ec; font-family:"Segoe UI", Arial, sans-serif; color:#2a2230;
  }
  form{
    background:#fff; border:1px solid #e7dcd3; border-radius:14px; padding:32px;
    width:300px; box-shadow:0 10px 30px rgba(42,34,48,0.1);
  }
  h1{ font-size:18px; margin:0 0 18px; text-align:center; }
  input{
    width:100%; padding:10px; border:1px solid #e7dcd3; border-radius:8px; font-size:15px; margin-bottom:14px;
    box-sizing:border-box;
  }
  button{
    width:100%; background:#c1654a; color:#fff; border:none; padding:12px; border-radius:8px;
    font-size:15px; cursor:pointer;
  }
  .error{ color:#a84f38; font-size:13px; text-align:center; margin-bottom:12px; }
</style>
</head>
<body>
  <form method="POST" action="/admin/login">
    <h1>כניסת ניהול</h1>
    __ERROR__
    <input type="password" name="password" placeholder="סיסמה" autofocus required>
    <button type="submit">כניסה</button>
  </form>
</body>
</html>
